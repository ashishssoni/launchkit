<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#0B1020"/>
  <text x="60" y="70" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">LaunchKit Architecture</text>
  <text x="60" y="105" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">Multi-tenant NestJS SaaS backend with auth, RBAC, Stripe, audit logs, and API keys</text>

  <rect x="60" y="160" width="220" height="110" rx="18" fill="#16213E" stroke="#38BDF8" stroke-width="2"/>
  <text x="90" y="205" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Clients</text>
  <text x="90" y="238" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18">Web App • Admin • Integrations</text>

  <rect x="360" y="130" width="360" height="170" rx="22" fill="#111827" stroke="#A78BFA" stroke-width="2"/>
  <text x="390" y="175" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">LaunchKit API</text>
  <text x="390" y="210" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="18">NestJS + Fastify + Swagger</text>
  <text x="390" y="245" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">Auth • Workspaces • Billing • API Keys</text>
  <text x="390" y="272" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">Audit Logs • Notifications • RBAC</text>

  <rect x="810" y="110" width="300" height="120" rx="18" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
  <text x="840" y="155" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Stripe</text>
  <text x="840" y="188" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="18">Checkout Sessions</text>
  <text x="840" y="214" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="18">Webhook Subscription Sync</text>

  <rect x="810" y="270" width="300" height="120" rx="18" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
  <text x="840" y="315" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">PostgreSQL</text>
  <text x="840" y="348" fill="#86EFAC" font-family="Arial, Helvetica, sans-serif" font-size="18">Users • Workspaces • Memberships</text>
  <text x="840" y="374" fill="#86EFAC" font-family="Arial, Helvetica, sans-serif" font-size="18">Subscriptions • API Keys • Audit Logs</text>

  <rect x="810" y="430" width="300" height="110" rx="18" fill="#1F2937" stroke="#F59E0B" stroke-width="2"/>
  <text x="840" y="475" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Redis</text>
  <text x="840" y="508" fill="#FCD34D" font-family="Arial, Helvetica, sans-serif" font-size="18">Cache • Queue-ready • Realtime-ready</text>

  <rect x="360" y="390" width="360" height="180" rx="22" fill="#111827" stroke="#F472B6" stroke-width="2"/>
  <text x="390" y="435" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Security & Access Layer</text>
  <text x="390" y="470" fill="#F9A8D4" font-family="Arial, Helvetica, sans-serif" font-size="18">JWT Access + Refresh Tokens</text>
  <text x="390" y="500" fill="#F9A8D4" font-family="Arial, Helvetica, sans-serif" font-size="18">Workspace Membership Checks</text>
  <text x="390" y="530" fill="#F9A8D4" font-family="Arial, Helvetica, sans-serif" font-size="18">Role Guards for Billing / Audit / API Keys</text>

  <line x1="280" y1="215" x2="360" y2="215" stroke="#38BDF8" stroke-width="4"/>
  <line x1="720" y1="185" x2="810" y2="170" stroke="#60A5FA" stroke-width="4"/>
  <line x1="720" y1="240" x2="810" y2="320" stroke="#34D399" stroke-width="4"/>
  <line x1="720" y1="270" x2="810" y2="470" stroke="#F59E0B" stroke-width="4"/>
  <line x1="540" y1="300" x2="540" y2="390" stroke="#F472B6" stroke-width="4"/>
</svg>
